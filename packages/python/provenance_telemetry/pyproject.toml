# packages/python/provenance_telemetry/pyproject.toml
#
# No section of the design pack prints this manifest, so it follows the shape
# that specs/11_CONTRACTS.md section 19 prints for the two packages it does
# specify.
#
# Dependencies are deliberately thin: this package is imported by the control
# plane, the agent runtime and every Lambda worker, so anything heavy here is
# paid for in four cold-start budgets.

[project]
name = "provenance-telemetry"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance_telemetry"]
