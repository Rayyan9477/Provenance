# =============================================================================
# Provenance — Alembic configuration
#
# Authority: specs/10_DATABASE_DDL.md §16 ("CockroachDB-specific Alembic
# configuration"), ops/41_RUNBOOK.md §4.1.
#
# Eight linear revisions, 0001_identity_aggregates through
# 0008_events_infrastructure. No branches. No autogenerate.
#
# THE DATABASE URL IS NOT IN THIS FILE AND NEVER WILL BE.
# `sqlalchemy.url` is declared and left empty so that the key cannot be
# quietly re-purposed somewhere else; db/migrations/env.py resolves the real
# URL from the COCKROACH_DATABASE_URL environment variable at runtime, which
# is what `asm-exec --env COCKROACH_DATABASE_URL='{{resolve:secretsmanager:...}}'`
# injects. A committed URL is a committed credential, and G0.3 scans this
# repository.
# =============================================================================

[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

# Revision filenames are written by hand (0001_identity_aggregates.py), not
# generated, so no date/slug template is configured.

# Injected from COCKROACH_DATABASE_URL at runtime, never committed.
sqlalchemy.url =

# DDL §16. Each revision gets its own transaction, so a failure inside
# 0003 cannot leave 0002 half-applied. env.py reads this value and passes it
# to context.configure(); it is load-bearing, not decoration.
transaction_per_migration = true

# =============================================================================
# Logging. Kept minimal and quiet: the alembic transcript is gate evidence
# (G2.1), and a chatty SQLAlchemy echo would put the connection string —
# credentials included — into a committed log.
# =============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
